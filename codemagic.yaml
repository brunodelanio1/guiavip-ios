workflows:
  ios-app-store:
    name: Guia VIP - App Store
    max_build_duration: 60
    integrations:
      app_store_connect: Guia Vip
    environment:
      groups:
        - ios_signing
      vars:
        XCODE_WORKSPACE: "Guia Vip/src/Guia Vip.xcworkspace"
        XCODE_SCHEME: "Guia Vip"
    scripts:
      - name: Instalar certificado e perfil
        script: |
          keychain initialize
          keychain add-certificates
          echo $CM_PROVISIONING_PROFILE | base64 --decode > /tmp/profile.mobileprovision
          mkdir -p ~/Library/MobileDevice/Provisioning\ Profiles
          UUID=$(security cms -D -i /tmp/profile.mobileprovision | grep -A1 UUID | grep string | sed -e 's/.*<string>//' -e 's/<\/string>//')
          echo "Profile UUID: $UUID"
          cp /tmp/profile.mobileprovision ~/Library/MobileDevice/Provisioning\ Profiles/$UUID.mobileprovision
          xcode-project use-profiles
      - name: Instalar dependencias CocoaPods
        script: |
          cd "Guia Vip/src"
          pod install --repo-update
      - name: Build IPA para App Store
        script: |
          xcodebuild \
            -workspace "$XCODE_WORKSPACE" \
            -scheme "$XCODE_SCHEME" \
            -configuration Release \
            -archivePath /tmp/GuiaVip.xcarchive \
            archive \
            DEVELOPMENT_TEAM=3QYS8AW46V \
            CODE_SIGN_STYLE=Manual \
            CODE_SIGN_IDENTITY="iPhone Distribution" \
            PROVISIONING_PROFILE_SPECIFIER="Guia VIP App Store" \
            COMPILER_INDEX_STORE_ENABLE=NO \
            2>&1 | tee /tmp/xcodebuild_full.log
          echo "Exit code: ${PIPESTATUS[0]}"
          exit ${PIPESTATUS[0]}
    artifacts:
      - /tmp/xcodebuild_full.log
      - /tmp/xcodebuild_logs/*.log
    publishing:
      app_store_connect:
        auth: integration
        submit_to_testflight: false
        submit_to_app_store: true
