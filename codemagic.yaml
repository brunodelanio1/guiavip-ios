workflows:
  ios-app-store:
    name: Guia VIP - App Store
    max_build_duration: 60
    integrations:
      app_store_connect: Guia Vip
    environment:
      groups:
        - ios_signing
      vars:
        BUNDLE_ID: br.com.fabricadeaplicativos.app2203439
        XCODE_WORKSPACE: "Guia Vip/src/Guia Vip.xcworkspace"
        XCODE_SCHEME: "Guia Vip"
    scripts:
      - name: Instalar certificado e perfil
        script: |
          keychain initialize
          certificate fetch-certificate --profile "$CM_PROVISIONING_PROFILE"
          keychain add-certificates
          xcode-project use-profiles
      - name: Instalar dependencias CocoaPods
        script: |
          cd "Guia Vip/src"
          pod install --repo-update
      - name: Build IPA para App Store
        script: |
          xcode-project build-ipa \
            --workspace "$XCODE_WORKSPACE" \
            --scheme "$XCODE_SCHEME"
    artifacts:
      - build/ios/ipa/*.ipa
      - /tmp/xcodebuild_logs/*.log
    publishing:
      app_store_connect:
        auth: integration
        submit_to_testflight: false
        submit_to_app_store: true
