workflows:
  ios-app-store:
    name: Guia VIP - App Store
    max_build_duration: 60
    integrations:
      app_store_connect: Guia Vip
    environment:
      groups:
        - ios_signing
      vars:
        XCODE_WORKSPACE: "Guia Vip/src/Guia Vip.xcworkspace"
        XCODE_SCHEME: "Guia Vip"
        BUNDLE_ID: "br.com.fabricadeaplicativos.app2203439"
        TEAM_ID: "3QYS8AW46V"
    scripts:
      - name: Criar e instalar certificado
        script: |
          set -e
          keychain initialize
          
          # Gera chave privada RSA
          openssl genrsa -out /tmp/dist.key 2048
          
          # Cria certificado de distribuição via API
          mkdir -p /tmp/certs
          app-store-connect certificates create \
            --type IOS_DISTRIBUTION \
            --certificate-key @file:/tmp/dist.key \
            --save \
            --certificates-dir /tmp/certs
          
          echo "Certificados em /tmp/certs:"
          ls -la /tmp/certs/
          
          # Instala o certificado no keychain
          for cert in /tmp/certs/*.p12; do
            echo "Importando p12: $cert"
            security import "$cert" \
              -k ~/Library/Keychains/cm_keychain.keychain-db \
              -T /usr/bin/codesign -T /usr/bin/security \
              -A || true
          done
          
          for cert in /tmp/certs/*.cer; do
            echo "Convertendo .cer: $cert"
            openssl x509 -inform DER -in "$cert" -out /tmp/dist_cert.pem 2>/dev/null || true
            openssl pkcs12 -export \
              -inkey /tmp/dist.key \
              -in /tmp/dist_cert.pem \
              -out /tmp/dist_cert.p12 \
              -passout pass:codemagic || true
            security import /tmp/dist_cert.p12 \
              -k ~/Library/Keychains/cm_keychain.keychain-db \
              -P codemagic \
              -T /usr/bin/codesign -T /usr/bin/security \
              -A || true
          done
          
          # Permite acesso ao keychain
          security set-key-partition-list \
            -S apple-tool:,apple:,codesign: \
            -s -k "" \
            ~/Library/Keychains/cm_keychain.keychain-db || true
          
          # Instala o perfil de provisioning
          echo $CM_PROVISIONING_PROFILE | base64 --decode > /tmp/profile.mobileprovision
          mkdir -p ~/Library/MobileDevice/Provisioning\ Profiles
          UUID=$(security cms -D -i /tmp/profile.mobileprovision | grep -A1 UUID | grep string | sed -e 's/.*<string>//' -e 's/<\/string>//')
          echo "UUID do perfil: $UUID"
          cp /tmp/profile.mobileprovision ~/Library/MobileDevice/Provisioning\ Profiles/$UUID.mobileprovision
          
          echo "--- Certificados no keychain ---"
          security find-identity -v -p codesigning
          
          xcode-project use-profiles

      - name: Instalar dependencias CocoaPods
        script: |
          cd "Guia Vip/src"
          pod install --repo-update

      - name: Corrigir code signing dos Pods
        script: |
          python3 - << 'PYEOF'
          import re
          path = 'Guia Vip/src/Pods/Pods.xcodeproj/project.pbxproj'
          with open(path, 'r') as f:
              content = f.read()
          content = re.sub(r'CODE_SIGN_STYLE = Manual;', 'CODE_SIGN_STYLE = Automatic;', content)
          content = re.sub(r'PROVISIONING_PROFILE_SPECIFIER = "[^"]+";', 'PROVISIONING_PROFILE_SPECIFIER = "";', content)
          content = re.sub(r'CODE_SIGNING_REQUIRED = YES;', 'CODE_SIGNING_REQUIRED = NO;', content)
          with open(path, 'w') as f:
              f.write(content)
          print("Pods corrigidos!")
          PYEOF

      - name: Arquivar app
        script: |
          xcodebuild \
            -workspace "$XCODE_WORKSPACE" \
            -scheme "$XCODE_SCHEME" \
            -configuration Release \
            -archivePath /tmp/GuiaVip.xcarchive \
            archive \
            COMPILER_INDEX_STORE_ENABLE=NO \
            2>&1 | tee /tmp/build.log
          exit ${PIPESTATUS[0]}

      - name: Exportar IPA
        script: |
          mkdir -p build/ios/ipa
          xcodebuild -exportArchive \
            -archivePath /tmp/GuiaVip.xcarchive \
            -exportOptionsPlist ExportOptions.plist \
            -exportPath build/ios/ipa \
            2>&1 | tee /tmp/export.log

    artifacts:
      - build/ios/ipa/*.ipa
      - /tmp/build.log
      - /tmp/export.log
    publishing:
      app_store_connect:
        auth: integration
        submit_to_testflight: true
        submit_to_app_store: false
