workflows:
  ios-app-store:
    name: Guia VIP - App Store
    max_build_duration: 60
    integrations:
      app_store_connect: Guia Vip
    environment:
      groups:
        - ios_signing
      vars:
        XCODE_WORKSPACE: "Guia Vip/src/Guia Vip.xcworkspace"
        XCODE_SCHEME: "Guia Vip"
        BUNDLE_ID: "br.com.fabricadeaplicativos.app2203439"
    scripts:
      - name: Configurar certificado e perfil
        script: |
          set -e
          KEYCHAIN_PATH=~/Library/Keychains/cm_keychain.keychain-db
          keychain initialize
          
          # Gera chave privada
          openssl genrsa -out /tmp/dist.key 2048
          mkdir -p /tmp/certs
          
          # Cria certificado via API da Apple
          app-store-connect certificates create \
            --type IOS_DISTRIBUTION \
            --certificate-key @file:/tmp/dist.key \
            --save \
            --certificates-dir /tmp/certs
          
          echo "=== Arquivos gerados em /tmp/certs ==="
          ls -la /tmp/certs/
          
          # Converte .cer para .p12 com chave privada
          for cert in /tmp/certs/*.cer /tmp/certs/*.pem; do
            [ -f "$cert" ] || continue
            echo "Processando: $cert"
            openssl x509 -inform DER -in "$cert" -out /tmp/dist_cert.pem 2>/dev/null \
              || cp "$cert" /tmp/dist_cert.pem
            openssl pkcs12 -export \
              -inkey /tmp/dist.key \
              -in /tmp/dist_cert.pem \
              -out /tmp/dist_cert.p12 \
              -passout pass:codemagic123 \
              -legacy 2>/dev/null \
              || openssl pkcs12 -export \
                -inkey /tmp/dist.key \
                -in /tmp/dist_cert.pem \
                -out /tmp/dist_cert.p12 \
                -passout pass:codemagic123
          done
          
          # Importa no keychain do Codemagic
          security import /tmp/dist_cert.p12 \
            -k "$KEYCHAIN_PATH" \
            -P codemagic123 \
            -T /usr/bin/codesign \
            -T /usr/bin/security \
            -A
          
          # Permite acesso — tenta com CM_KEYCHAIN_PASSWORD e sem senha
          security set-key-partition-list \
            -S apple-tool:,apple:,codesign: \
            -s -k "${CM_KEYCHAIN_PASSWORD:-}" \
            "$KEYCHAIN_PATH" 2>/dev/null || \
          security set-key-partition-list \
            -S apple-tool:,apple:,codesign: \
            -s "$KEYCHAIN_PATH" 2>/dev/null || true
          
          echo "=== Identidades no keychain ==="
          security find-identity -v -p codesigning
          
          # Instala perfil de provisioning
          echo $CM_PROVISIONING_PROFILE | base64 --decode > /tmp/profile.mobileprovision
          mkdir -p ~/Library/MobileDevice/Provisioning\ Profiles
          UUID=$(security cms -D -i /tmp/profile.mobileprovision | grep -A1 UUID | grep string | sed -e 's/.*<string>//' -e 's/<\/string>//')
          echo "UUID do perfil: $UUID"
          cp /tmp/profile.mobileprovision ~/Library/MobileDevice/Provisioning\ Profiles/$UUID.mobileprovision
          xcode-project use-profiles

      - name: Instalar dependencias CocoaPods
        script: |
          cd "Guia Vip/src"
          pod install --repo-update

      - name: Corrigir code signing dos Pods
        script: |
          python3 - << 'PYEOF'
          import re
          path = 'Guia Vip/src/Pods/Pods.xcodeproj/project.pbxproj'
          with open(path, 'r') as f:
              content = f.read()
          content = re.sub(r'CODE_SIGN_STYLE = Manual;', 'CODE_SIGN_STYLE = Automatic;', content)
          content = re.sub(r'PROVISIONING_PROFILE_SPECIFIER = "[^"]+";', 'PROVISIONING_PROFILE_SPECIFIER = "";', content)
          content = re.sub(r'CODE_SIGNING_REQUIRED = YES;', 'CODE_SIGNING_REQUIRED = NO;', content)
          with open(path, 'w') as f:
              f.write(content)
          print("Pods corrigidos!")
          PYEOF

      - name: Arquivar app
        script: |
          xcodebuild \
            -workspace "$XCODE_WORKSPACE" \
            -scheme "$XCODE_SCHEME" \
            -configuration Release \
            -archivePath /tmp/GuiaVip.xcarchive \
            archive \
            COMPILER_INDEX_STORE_ENABLE=NO \
            2>&1 | tee /tmp/build.log
          exit ${PIPESTATUS[0]}

      - name: Exportar IPA
        script: |
          mkdir -p build/ios/ipa
          xcodebuild -exportArchive \
            -archivePath /tmp/GuiaVip.xcarchive \
            -exportOptionsPlist ExportOptions.plist \
            -exportPath build/ios/ipa \
            2>&1 | tee /tmp/export.log

    artifacts:
      - build/ios/ipa/*.ipa
      - /tmp/build.log
      - /tmp/export.log
    publishing:
      app_store_connect:
        auth: integration
        submit_to_testflight: true
        submit_to_app_store: false
