name: iOS Build

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-latest
    timeout-minutes: 180

    steps:
      - uses: actions/checkout@v4

      - name: Cache CocoaPods
        uses: actions/cache@v4
        with:
          path: |
            Guia Vip/src/Pods
            ~/.cocoapods
          key: pods-${{ hashFiles('Guia Vip/src/Podfile.lock') }}
          restore-keys: pods-

      - name: Install CocoaPods
        run: |
          cd "Guia Vip/src"
          pod install

      - name: Setup Keychain, Certificado e Perfil
        env:
          APP_STORE_CONNECT_KEY_IDENTIFIER: ${{ secrets.APP_STORE_CONNECT_KEY_IDENTIFIER }}
          APP_STORE_CONNECT_ISSUER_ID: ${{ secrets.APP_STORE_CONNECT_ISSUER_ID }}
          APP_STORE_CONNECT_PRIVATE_KEY: ${{ secrets.APP_STORE_CONNECT_PRIVATE_KEY }}
          CERTIFICATE_P12_BASE64: ${{ secrets.CERTIFICATE_P12_BASE64 }}
          CERTIFICATE_P12_PASSWORD: ${{ secrets.CERTIFICATE_P12_PASSWORD }}
        run: |
          KEYCHAIN_PATH=$RUNNER_TEMP/build.keychain
          KEYCHAIN_PASSWORD="temporarypassword"
          P12_PASSWORD="guiavip2026"

          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security set-keychain-settings -lut 21600 "$KEYCHAIN_PATH"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security list-keychain -d user -s "$KEYCHAIN_PATH"

          python3 << 'PYEOF'
          import json, os
          data = {
              "key_id": os.environ["APP_STORE_CONNECT_KEY_IDENTIFIER"],
              "issuer_id": os.environ["APP_STORE_CONNECT_ISSUER_ID"],
              "key": os.environ["APP_STORE_CONNECT_PRIVATE_KEY"],
              "in_house": False
          }
          with open("/tmp/api_key.json", "w") as f:
              json.dump(data, f)
          print("api_key.json criado!")
          PYEOF

          mkdir -p /tmp/certs
          mkdir -p "$HOME/Library/MobileDevice/Provisioning Profiles"

          if [ -n "$CERTIFICATE_P12_BASE64" ]; then
            echo "Importando certificado do GitHub Secret..."
            echo "$CERTIFICATE_P12_BASE64" | base64 --decode > /tmp/certs/cert.p12
            security import /tmp/certs/cert.p12 \
              -k "$KEYCHAIN_PATH" \
              -P "$CERTIFICATE_P12_PASSWORD" \
              -T /usr/bin/codesign \
              -T /usr/bin/xcodebuild
            security set-key-partition-list \
              -S apple-tool:,apple: \
              -s -k "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
            echo "Certificado importado do Secret com sucesso!"
          else
            echo "Secret não encontrado. Criando novo certificado..."
            fastlane cert \
              --api_key_path /tmp/api_key.json \
              --output_path /tmp/certs \
              --platform ios \
              --keychain_path "$KEYCHAIN_PATH" \
              --keychain_password "$KEYCHAIN_PASSWORD"

            echo "Exportando certificado como .p12 para salvar como Secret..."
            CERT_ID=$(security find-identity -v -p codesigning "$KEYCHAIN_PATH" | grep "Apple Distribution" | awk '{print $2}')
            security export \
              -k "$KEYCHAIN_PATH" \
              -t identities \
              -f pkcs12 \
              -P "$P12_PASSWORD" \
              -o /tmp/certs/distribution.p12
            base64 -i /tmp/certs/distribution.p12 -o /tmp/certs/distribution_base64.txt
            echo "============================================"
            echo "ATENÇÃO: Salve o arquivo distribution_base64.txt"
            echo "como Secret CERTIFICATE_P12_BASE64 no GitHub!"
            echo "Senha do .p12: $P12_PASSWORD"
            echo "Salve como Secret CERTIFICATE_P12_PASSWORD"
            echo "============================================"
          fi

          # Baixa e instala o perfil
          fastlane sigh \
            --api_key_path /tmp/api_key.json \
            --app_identifier "br.com.fabricadeaplicativos.app2203439" \
            --platform ios \
            --force

          security find-identity -v -p codesigning "$KEYCHAIN_PATH"

          echo "KEYCHAIN_PATH=$KEYCHAIN_PATH" >> $GITHUB_ENV
          echo "KEYCHAIN_PASSWORD=$KEYCHAIN_PASSWORD" >> $GITHUB_ENV

      - name: Upload certificado p12 como artifact
        uses: actions/upload-artifact@v4
        with:
          name: certificate-p12
          path: /tmp/certs/distribution_base64.txt
          if-no-files-found: ignore

      - name: Injetar perfil no projeto Xcode
        run: |
          pip3 install codemagic-cli-tools --break-system-packages --quiet
          xcode-project use-profiles

      - name: Fix Pods code signing
        run: |
          python3 << 'PYEOF'
          import re
          path = "Guia Vip/src/Pods/Pods.xcodeproj/project.pbxproj"
          with open(path, "r") as f:
              content = f.read()
          content = re.sub(r"CODE_SIGN_STYLE = Manual;", "CODE_SIGN_STYLE = Automatic;", content)
          content = re.sub(r'PROVISIONING_PROFILE_SPECIFIER = "[^"]+";', 'PROVISIONING_PROFILE_SPECIFIER = "";', content)
          content = re.sub(r"CODE_SIGNING_REQUIRED = YES;", "CODE_SIGNING_REQUIRED = NO;", content)
          with open(path, "w") as f:
              f.write(content)
          print("Pods corrigidos!")
          PYEOF

      - name: Build IPA com fastlane gym
        run: |
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"

          gem install fastlane --no-document --quiet

          fastlane gym \
            --workspace "Guia Vip/src/Guia Vip.xcworkspace" \
            --scheme "Guia Vip" \
            --configuration Release \
            --export_method app-store \
            --team_id "3QYS8AW46V" \
            --output_directory build/ios/ipa \
            --output_name "GuiaVip.ipa" \
            --clean true \
            --xcargs "COMPILER_INDEX_STORE_ENABLE=NO OTHER_CODE_SIGN_FLAGS='--keychain $KEYCHAIN_PATH'"

      - name: Upload to TestFlight
        env:
          APP_STORE_CONNECT_KEY_IDENTIFIER: ${{ secrets.APP_STORE_CONNECT_KEY_IDENTIFIER }}
          APP_STORE_CONNECT_ISSUER_ID: ${{ secrets.APP_STORE_CONNECT_ISSUER_ID }}
          APP_STORE_CONNECT_PRIVATE_KEY: ${{ secrets.APP_STORE_CONNECT_PRIVATE_KEY }}
        run: |
          pip3 install codemagic-cli-tools --break-system-packages --quiet
          app-store-connect publish \
            --path "build/ios/ipa/*.ipa" \
            --testflight

      - name: Upload IPA artifact
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ios-build
          path: build/ios/ipa/*.ipa

      - name: Limpar keychain
        if: always()
        run: |
          security delete-keychain "$KEYCHAIN_PATH" || true
