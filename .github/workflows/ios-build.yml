name: iOS Build

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-latest

    steps:
      - uses: actions/checkout@v4

      - name: Setup certificate e perfil com fastlane
        env:
          APP_STORE_CONNECT_KEY_IDENTIFIER: ${{ secrets.APP_STORE_CONNECT_KEY_IDENTIFIER }}
          APP_STORE_CONNECT_ISSUER_ID: ${{ secrets.APP_STORE_CONNECT_ISSUER_ID }}
          APP_STORE_CONNECT_PRIVATE_KEY: ${{ secrets.APP_STORE_CONNECT_PRIVATE_KEY }}
        run: |
          # Cria arquivo de API key pro fastlane
          cat > /tmp/api_key.json << APIEOF
          {
            "key_id": "$APP_STORE_CONNECT_KEY_IDENTIFIER",
            "issuer_id": "$APP_STORE_CONNECT_ISSUER_ID",
            "key": "$APP_STORE_CONNECT_PRIVATE_KEY",
            "in_house": false
          }
          APIEOF
          
          mkdir -p /tmp/certs /tmp/profiles
          
          # Baixa/cria certificado de distribuição (salva chave privada no keychain)
          fastlane cert \
            --api_key_path /tmp/api_key.json \
            --output_path /tmp/certs \
            --platform ios
          
          # Baixa/cria provisioning profile App Store
          fastlane sigh \
            --api_key_path /tmp/api_key.json \
            --bundle_identifier "br.com.fabricadeaplicativos.app2203439" \
            --output_path /tmp/profiles \
            --platform ios
          
          # Instala o perfil
          mkdir -p ~/Library/MobileDevice/Provisioning\ Profiles
          for profile in /tmp/profiles/*.mobileprovision; do
            [ -f "$profile" ] || continue
            UUID=$(security cms -D -i "$profile" | grep -A1 UUID | grep string | sed -e 's/.*<string>//' -e 's/<\/string>//')
            cp "$profile" ~/Library/MobileDevice/Provisioning\ Profiles/$UUID.mobileprovision
            echo "Perfil instalado: $UUID"
          done
          
          echo "=== Certificados disponíveis ==="
          security find-identity -v -p codesigning

      - name: Install CocoaPods
        run: |
          cd "Guia Vip/src"
          pod install --repo-update

      - name: Fix Pods code signing
        run: |
          python3 - << 'PYEOF'
          import re
          path = 'Guia Vip/src/Pods/Pods.xcodeproj/project.pbxproj'
          with open(path, 'r') as f:
              content = f.read()
          content = re.sub(r'CODE_SIGN_STYLE = Manual;', 'CODE_SIGN_STYLE = Automatic;', content)
          content = re.sub(r'PROVISIONING_PROFILE_SPECIFIER = "[^"]+";', 'PROVISIONING_PROFILE_SPECIFIER = "";', content)
          content = re.sub(r'CODE_SIGNING_REQUIRED = YES;', 'CODE_SIGNING_REQUIRED = NO;', content)
          with open(path, 'w') as f:
              f.write(content)
          print("Pods corrigidos!")
          PYEOF

      - name: Build IPA
        run: |
          xcodebuild \
            -workspace "Guia Vip/src/Guia Vip.xcworkspace" \
            -scheme "Guia Vip" \
            -configuration Release \
            -archivePath /tmp/GuiaVip.xcarchive \
            archive \
            COMPILER_INDEX_STORE_ENABLE=NO \
            2>&1
          
          mkdir -p build/ios/ipa
          xcodebuild -exportArchive \
            -archivePath /tmp/GuiaVip.xcarchive \
            -exportOptionsPlist ExportOptions.plist \
            -exportPath build/ios/ipa \
            2>&1

      - name: Upload to TestFlight
        env:
          APP_STORE_CONNECT_KEY_IDENTIFIER: ${{ secrets.APP_STORE_CONNECT_KEY_IDENTIFIER }}
          APP_STORE_CONNECT_ISSUER_ID: ${{ secrets.APP_STORE_CONNECT_ISSUER_ID }}
          APP_STORE_CONNECT_PRIVATE_KEY: ${{ secrets.APP_STORE_CONNECT_PRIVATE_KEY }}
        run: |
          pip3 install codemagic-cli-tools --break-system-packages
          app-store-connect publish \
            --path build/ios/ipa/*.ipa \
            --testflight

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ios-build
          path: |
            build/ios/ipa/*.ipa
