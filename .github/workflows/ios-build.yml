name: iOS Build

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-latest
    timeout-minutes: 180

    steps:
      - uses: actions/checkout@v4

      - name: Cache CocoaPods
        uses: actions/cache@v4
        with:
          path: |
            Guia Vip/src/Pods
            ~/.cocoapods
          key: pods-${{ hashFiles('Guia Vip/src/Podfile.lock') }}
          restore-keys: pods-

      - name: Selecionar Xcode 26
        run: |
          ls /Applications/ | grep Xcode
          sudo xcode-select -s /Applications/Xcode_26.3.app
          xcodebuild -version

      - name: Install CocoaPods
        run: |
          cd "Guia Vip/src"
          pod install

      - name: Setup Keychain, Certificado e Perfil
        env:
          APP_STORE_CONNECT_KEY_IDENTIFIER: ${{ secrets.APP_STORE_CONNECT_KEY_IDENTIFIER }}
          APP_STORE_CONNECT_ISSUER_ID: ${{ secrets.APP_STORE_CONNECT_ISSUER_ID }}
          APP_STORE_CONNECT_PRIVATE_KEY: ${{ secrets.APP_STORE_CONNECT_PRIVATE_KEY }}
          CERTIFICATE_P12_BASE64: ${{ secrets.CERTIFICATE_P12_BASE64 }}
          CERTIFICATE_P12_PASSWORD: ${{ secrets.CERTIFICATE_P12_PASSWORD }}
        run: |
          set -e
          KEYCHAIN_PATH=$RUNNER_TEMP/build.keychain
          KEYCHAIN_PASSWORD="temporarypassword"
          P12_PASSWORD="guiavip2026"

          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security set-keychain-settings -lut 21600 "$KEYCHAIN_PATH"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security list-keychain -d user -s "$KEYCHAIN_PATH"

          mkdir -p /tmp/certs /tmp/profiles
          mkdir -p "$HOME/Library/MobileDevice/Provisioning Profiles"

          python3 -c "
          import json, os
          data = {
              'key_id': os.environ['APP_STORE_CONNECT_KEY_IDENTIFIER'],
              'issuer_id': os.environ['APP_STORE_CONNECT_ISSUER_ID'],
              'key': os.environ['APP_STORE_CONNECT_PRIVATE_KEY'],
              'in_house': False
          }
          with open('/tmp/api_key.json', 'w') as f:
              json.dump(data, f)
          print('api_key.json criado!')
          "

          if [ -n "$CERTIFICATE_P12_BASE64" ]; then
            echo "Importando certificado do Secret..."
            echo "$CERTIFICATE_P12_BASE64" | base64 --decode > /tmp/certs/cert.p12
            security import /tmp/certs/cert.p12 \
              -k "$KEYCHAIN_PATH" \
              -P "$CERTIFICATE_P12_PASSWORD" \
              -T /usr/bin/codesign \
              -T /usr/bin/xcodebuild
            security set-key-partition-list \
              -S apple-tool:,apple: \
              -s -k "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
            echo "Certificado importado com sucesso!"
          else
            echo "Criando novo certificado..."
            fastlane cert \
              --api_key_path /tmp/api_key.json \
              --output_path /tmp/certs \
              --platform ios \
              --keychain_path "$KEYCHAIN_PATH" \
              --keychain_password "$KEYCHAIN_PASSWORD"
            echo "Exportando p12..."
            security export \
              -k "$KEYCHAIN_PATH" \
              -t identities \
              -f pkcs12 \
              -P "$P12_PASSWORD" \
              -o /tmp/certs/distribution.p12
            base64 -i /tmp/certs/distribution.p12 -o /tmp/certs/distribution_base64.txt
            echo "Salve o arquivo como Secret CERTIFICATE_P12_BASE64"
            echo "Senha: $P12_PASSWORD -> Secret CERTIFICATE_P12_PASSWORD"
          fi

          fastlane sigh \
            --api_key_path /tmp/api_key.json \
            --app_identifier "br.com.fabricadeaplicativos.app2203439" \
            --platform ios \
            --force \
            --output_path /tmp/profiles

          python3 -c "
          import subprocess, os, shutil, glob, plistlib
          profiles = glob.glob('/tmp/profiles/*.mobileprovision')
          if not profiles:
              print('ERRO: perfil nao encontrado')
              exit(1)
          result = subprocess.run(['security', 'cms', '-D', '-i', profiles[0]], capture_output=True)
          plist = plistlib.loads(result.stdout)
          uuid = plist['UUID']
          name = plist.get('Name', 'unknown')
          dest_dir = os.path.expanduser('~/Library/MobileDevice/Provisioning Profiles')
          dest = f'{dest_dir}/{uuid}.mobileprovision'
          shutil.copy(profiles[0], dest)
          print(f'Perfil instalado: {name}')
          print(f'UUID: {uuid}')
          with open('/tmp/profile_uuid.txt', 'w') as f:
              f.write(uuid)
          "

          security find-identity -v -p codesigning "$KEYCHAIN_PATH"

          echo "KEYCHAIN_PATH=$KEYCHAIN_PATH" >> $GITHUB_ENV
          echo "KEYCHAIN_PASSWORD=$KEYCHAIN_PASSWORD" >> $GITHUB_ENV

      - name: Upload certificado p12 como artifact
        uses: actions/upload-artifact@v4
        with:
          name: certificate-p12
          path: /tmp/certs/distribution_base64.txt
          if-no-files-found: ignore

      - name: Injetar perfil no projeto Xcode
        run: |
          pip3 install codemagic-cli-tools --break-system-packages --quiet
          xcode-project use-profiles

      - name: Incrementar Build Number
        run: |
          python3 -c "
          import plistlib, glob
          plists = glob.glob('Guia Vip/src/**/*.plist', recursive=True)
          for path in plists:
              try:
                  with open(path, 'rb') as f:
                      plist = plistlib.load(f)
                  if 'CFBundleVersion' in plist:
                      current = int(plist['CFBundleVersion'])
                      plist['CFBundleVersion'] = str(current + 1)
                      with open(path, 'wb') as f:
                          plistlib.dump(plist, f)
                      print(f'Build number: {current} -> {current + 1} em {path}')
              except:
                  pass
          "

      - name: Remover NSUserTrackingUsageDescription
        run: |
          python3 -c "
          import plistlib, glob
          plists = glob.glob('Guia Vip/src/**/*.plist', recursive=True)
          for path in plists:
              try:
                  with open(path, 'rb') as f:
                      plist = plistlib.load(f)
                  if 'NSUserTrackingUsageDescription' in plist:
                      del plist['NSUserTrackingUsageDescription']
                      with open(path, 'wb') as f:
                          plistlib.dump(plist, f)
                      print(f'Removido de: {path}')
              except:
                  pass
          "

      - name: Fix Pods code signing
        run: |
          python3 -c "
          import re
          path = 'Guia Vip/src/Pods/Pods.xcodeproj/project.pbxproj'
          with open(path, 'r') as f:
              content = f.read()
          content = re.sub(r'CODE_SIGN_STYLE = Manual;', 'CODE_SIGN_STYLE = Automatic;', content)
          content = re.sub(r'PROVISIONING_PROFILE_SPECIFIER = \"[^\"]+\";', 'PROVISIONING_PROFILE_SPECIFIER = \"\";', content)
          content = re.sub(r'CODE_SIGNING_REQUIRED = YES;', 'CODE_SIGNING_REQUIRED = NO;', content)
          with open(path, 'w') as f:
              f.write(content)
          print('Pods corrigidos!')
          "

      - name: Build Archive e Export IPA
        run: |
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"

          gem install fastlane --no-document --quiet

          PROFILE_UUID=$(cat /tmp/profile_uuid.txt)
          echo "Usando perfil UUID: $PROFILE_UUID"

          ARCHIVE_PATH=/tmp/GuiaVip.xcarchive

          fastlane gym \
            --workspace "Guia Vip/src/Guia Vip.xcworkspace" \
            --scheme "Guia Vip" \
            --configuration Release \
            --skip_package_ipa true \
            --archive_path "$ARCHIVE_PATH" \
            --clean true \
            --xcargs "COMPILER_INDEX_STORE_ENABLE=NO"

          python3 -c "
          import subprocess, os
          uuid = open('/tmp/profile_uuid.txt').read().strip()
          plist = f'''<?xml version=\"1.0\" encoding=\"UTF-8\"?>
          <!DOCTYPE plist PUBLIC \"-//Apple//DTD PLIST 1.0//EN\" \"http://www.apple.com/DTDs/PropertyList-1.0.dtd\">
          <plist version=\"1.0\">
          <dict>
            <key>method</key>
            <string>app-store</string>
            <key>teamID</key>
            <string>3QYS8AW46V</string>
            <key>signingStyle</key>
            <string>manual</string>
            <key>signingCertificate</key>
            <string>Apple Distribution</string>
            <key>provisioningProfiles</key>
            <dict>
              <key>br.com.fabricadeaplicativos.app2203439</key>
              <string>{uuid}</string>
            </dict>
          </dict>
          </plist>'''
          with open('/tmp/ExportOptions.plist', 'w') as f:
              f.write(plist)
          print('ExportOptions.plist criado com UUID:', uuid)
          "

          cat /tmp/ExportOptions.plist

          mkdir -p build/ios/ipa
          xcodebuild -exportArchive \
            -archivePath "$ARCHIVE_PATH" \
            -exportOptionsPlist /tmp/ExportOptions.plist \
            -exportPath build/ios/ipa

          ls -la build/ios/ipa/

      - name: Upload to TestFlight
        env:
          APP_STORE_CONNECT_KEY_IDENTIFIER: ${{ secrets.APP_STORE_CONNECT_KEY_IDENTIFIER }}
          APP_STORE_CONNECT_ISSUER_ID: ${{ secrets.APP_STORE_CONNECT_ISSUER_ID }}
          APP_STORE_CONNECT_PRIVATE_KEY: ${{ secrets.APP_STORE_CONNECT_PRIVATE_KEY }}
        run: |
          pip3 install codemagic-cli-tools --break-system-packages --quiet
          app-store-connect publish \
            --path "build/ios/ipa/*.ipa" \
            --testflight

      - name: Upload IPA artifact
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ios-build
          path: build/ios/ipa/*.ipa

      - name: Limpar keychain
        if: always()
        run: |
          security delete-keychain "$KEYCHAIN_PATH" || true
